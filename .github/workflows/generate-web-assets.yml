name: Generate web assets

on:
  push:
    branches: [feature/complete-controller]
    paths:
      - "web/**"
      - ".github/workflows/generate-web-assets.yml"

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[web-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/complete-controller
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Install frontend dependencies
        working-directory: web
        run: npm install
      - name: Test and build embedded frontend
        working-directory: web
        run: |
          npm test -- --run
          npm run build
      - name: Commit lockfile and generated header
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package-lock.json components/ro_network/include/ro/web_assets.hpp
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: refresh embedded web assets [web-generated]"
          git push origin HEAD:feature/complete-controller
