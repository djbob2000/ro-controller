name: Release firmware

on:
  push:
    branches: [main]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_exists: ${{ steps.existing.outputs.release_exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="v$(tr -d '[:space:]' < VERSION)"
          fi
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check whether release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $VERSION already exists; nothing to publish."
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.release_exists != 'true'
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-S3 production firmware
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32s3
          idf.py build
      - name: Package firmware
        shell: bash
        run: bash scripts/package-firmware.sh build firmware-artifact
      - name: Create versioned release archive
        shell: bash
        run: |
          set -euo pipefail
          archive="ro-controller-esp32s3-${VERSION}.zip"
          python3 - "$archive" <<'PY'
          import pathlib
          import sys
          import zipfile

          archive = pathlib.Path(sys.argv[1])
          root = pathlib.Path("firmware-artifact")
          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              for path in sorted(root.rglob("*")):
                  if path.is_file():
                      zf.write(path, path.relative_to(root))
          PY
          sha256sum "$archive" > "${archive}.sha256"
          sha256sum -c "${archive}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ needs.prepare.outputs.version }}
          path: |
            ro-controller-esp32s3-${{ needs.prepare.outputs.version }}.zip
            ro-controller-esp32s3-${{ needs.prepare.outputs.version }}.zip.sha256
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.release_exists != 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-assets-${{ needs.prepare.outputs.version }}
          path: release-assets
      - name: Ensure release tag exists
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$VERSION" "$GITHUB_SHA" -m "RO Controller $VERSION"
            git push origin "$VERSION"
          fi
      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          extra_args=()
          if [[ "$VERSION" == v0.* ]]; then
            extra_args+=(--prerelease)
          fi
          gh release create "$VERSION" \
            release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "RO Controller $VERSION" \
            "${extra_args[@]}"
