name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure host tests
        run: cmake -S tests/host -B build-host
      - name: Build host tests
        run: cmake --build build-host -j2
      - name: Run host tests
        run: ctest --test-dir build-host --output-on-failure
      - name: Validate target test syntax
        run: python -m compileall -q tests/target
      - name: Test firmware packaging
        run: bash tests/host/test_package_firmware.sh

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run web tests
        run: npm test -- --run
      - name: Build embedded frontend
        run: npm run build
      - name: Verify generated asset is committed
        working-directory: .
        run: git diff --exit-code -- components/ro_network/include/ro/web_assets.hpp web/package-lock.json

  esp-idf-build:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-S3 firmware
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32s3
          idf.py build
      - name: Collect flash-ready firmware bundle
        if: success()
        shell: bash
        run: bash scripts/package-firmware.sh build firmware-artifact
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ro-controller-esp32s3
          path: firmware-artifact

  esp-idf-test-hooks-build:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-S3 bench-test firmware
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          idf.py -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.test.defaults" set-target esp32s3
          idf.py -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.test.defaults" build
