name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure host tests
        run: cmake -S tests/host -B build-host
      - name: Build host tests
        run: cmake --build build-host -j2
      - name: Run host tests
        run: ctest --test-dir build-host --output-on-failure
      - name: Validate target test syntax
        run: python -m compileall -q tests/target

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run web tests
        run: npm test -- --run
      - name: Build embedded frontend
        run: npm run build
      - name: Verify generated asset is committed
        working-directory: .
        run: git diff --exit-code -- components/ro_network/include/ro/web_assets.hpp web/package-lock.json

  esp-idf-build:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-S3 firmware
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32s3
          idf.py build
      - name: Collect flash-ready firmware bundle
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p firmware-artifact/bootloader firmware-artifact/partition_table
          cp build/ro_controller.bin firmware-artifact/
          cp build/bootloader/bootloader.bin firmware-artifact/bootloader/
          cp build/partition_table/partition-table.bin firmware-artifact/partition_table/
          test -f build/ota_data_initial.bin && cp build/ota_data_initial.bin firmware-artifact/ || true
          cp build/flash_args firmware-artifact/
          cp build/flasher_args.json firmware-artifact/
          cat > firmware-artifact/FLASHING.txt <<'EOF'
          RO Controller - ESP32-S3 flash bundle

          Requirements:
            python -m pip install --upgrade esptool

          From this extracted directory, replace PORT with your serial port and run:
            python -m esptool --chip esp32s3 -p PORT -b 460800 --before default_reset --after hard_reset write_flash @flash_args

          macOS example:
            python -m esptool --chip esp32s3 -p /dev/cu.usbmodemXXXX -b 460800 --before default_reset --after hard_reset write_flash @flash_args

          Linux example:
            python -m esptool --chip esp32s3 -p /dev/ttyACM0 -b 460800 --before default_reset --after hard_reset write_flash @flash_args

          The address/file mapping is generated by ESP-IDF 6.0.2 and is also available in flasher_args.json.
          Do not flash the bench-test build to the installed controller; this artifact is the production build.
          EOF
          sha256sum firmware-artifact/bootloader/bootloader.bin \
                    firmware-artifact/partition_table/partition-table.bin \
                    firmware-artifact/ro_controller.bin \
                    > firmware-artifact/SHA256SUMS.txt
          test -f firmware-artifact/ota_data_initial.bin && sha256sum firmware-artifact/ota_data_initial.bin >> firmware-artifact/SHA256SUMS.txt || true
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ro-controller-esp32s3
          path: firmware-artifact

  esp-idf-test-hooks-build:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-S3 bench-test firmware
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          idf.py -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.test.defaults" set-target esp32s3
          idf.py -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.test.defaults" build
